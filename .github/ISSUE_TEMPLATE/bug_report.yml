name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, credentials, personal data, or vulnerability details. Security issues must be reported privately."
  - type: input
    id: version
    attributes: { label: Package version }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
